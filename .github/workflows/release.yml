name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Linux-only system deps required by Tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Prepare updater signing key
        shell: python
        env:
          SIGNING_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          import base64, os
          from pathlib import Path

          value = os.environ["SIGNING_INPUT"].strip()
          # Some terminal copies include a trailing prompt marker or encoded newline.
          for suffix in ("%0D%0A", "%0A", "%"):
              value = value.removesuffix(suffix).rstrip()
          decoded = base64.b64decode(value, validate=True).splitlines()
          if len(decoded) != 2 or not decoded[0].startswith(b"untrusted comment:"):
              raise ValueError("Invalid updater signing key format")
          base64.b64decode(decoded[1], validate=True)
          path = Path(os.environ["RUNNER_TEMP"]) / "nordenvault-updater.key"
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "w") as key:
              key.write(value)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TAURI_SIGNING_PRIVATE_KEY={path}\n")

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NordenVault ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install NordenVault for your platform."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}


      - name: Remove temporary signing file
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "nordenvault-updater.key").unlink(missing_ok=True)
